<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a6fe0"/>
      <stop offset="1" stop-color="#10306a"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3ecfb"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3ecfb"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- cover / page edges -->
  <path d="M256,404 C204,378 132,374 64,394 L64,170 L86,166 L86,380 C150,362 214,368 256,392 C298,368 362,362 426,380 L426,166 L448,170 L448,394 C380,374 308,378 256,404 Z" fill="#0b2554" opacity="0.55"/>
  <path d="M256,392 C214,368 150,362 86,380 L86,372 C150,354 214,360 256,384 C298,360 362,354 426,372 L426,380 C362,362 298,368 256,392 Z" fill="#c9d9f5"/>
  <!-- pages -->
  <path d="M256,150 C212,124 146,118 86,138 L86,372 C150,354 214,360 256,384 Z" fill="url(#pageL)"/>
  <path d="M256,150 C300,124 366,118 426,138 L426,372 C362,354 298,360 256,384 Z" fill="url(#pageR)"/>
  <path d="M256,150 L256,384" stroke="#b8cbef" stroke-width="3"/>
  <!-- letters -->
  <text x="172" y="318" text-anchor="middle" font-family="FreeSerif" font-style="italic" font-weight="700" font-size="190" fill="#184ea9">S</text>
  <text x="342" y="318" text-anchor="middle" font-family="FreeSerif" font-style="italic" font-weight="700" font-size="190" fill="#184ea9">L</text>
  <!-- Cameroon flag across the top, as wide as the book -->
  <rect x="61" y="39" width="390" height="60" rx="6" fill="#0b2554" opacity="0.35"/>
  <rect x="64" y="42" width="128.00" height="54" fill="#007a5e"/>
  <rect x="192.00" y="42" width="128.00" height="54" fill="#ce1126"/>
  <rect x="320.00" y="42" width="128.00" height="54" fill="#fcd116"/>
  <polygon points="256.00,49.00 260.49,62.82 275.02,62.82 263.27,71.36 267.76,85.18 256.00,76.64 244.24,85.18 248.73,71.36 236.98,62.82 251.51,62.82" fill="#fcd116"/>
  <!-- 237 on a gold banner under the book, as wide as the flag -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.45" stop-color="#e8b730"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
  </defs>
  <rect x="61" y="413" width="390" height="62" rx="7" fill="#0b2554" opacity="0.35"/>
  <rect x="64" y="416" width="384" height="56" rx="5" fill="url(#gold)"/>
  <rect x="64" y="416" width="384" height="56" rx="5" fill="none" stroke="#8a6508" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="62" text-anchor="middle" stroke="#10306a" stroke-width="7" stroke-linejoin="round" paint-order="stroke">
    <text x="190" y="467" fill="#007a5e">2</text>
    <text x="256" y="467" fill="#ce1126">3</text>
    <text x="322" y="467" fill="#fcd116">7</text>
  </g>
</svg>
