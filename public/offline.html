<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1d5fd1" />
    <title>No connection · StudentLife237</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: linear-gradient(135deg, #0f172a, #10306a 55%, #1d5fd1);
        color: #fff;
        text-align: center;
        padding: 24px;
      }
      .flag {
        display: flex;
        height: 6px;
        width: 120px;
        margin: 0 auto 24px;
        border-radius: 3px;
        overflow: hidden;
      }
      .flag span {
        flex: 1;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 8px;
      }
      p {
        color: #d9eaff;
        max-width: 22rem;
        margin: 0 auto 24px;
        line-height: 1.5;
      }
      button {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 999px;
        padding: 12px 24px;
        background: #f2a900;
        color: #0f172a;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="flag" aria-hidden="true">
        <span style="background: #007a5e"></span><span style="background: #ce1126"></span
        ><span style="background: #fcd116"></span>
      </div>
      <h1>You are offline</h1>
      <p>
        StudentLife237 needs an internet connection. Check your data or Wi-Fi, then try again.
        Answers in a running test are kept on your phone until you are back online.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
